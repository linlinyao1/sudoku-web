<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>数独 Sudoku</title>
<style>
  :root{
    --ink:#1f2430; --muted:#8a90a3; --line:#c9cdd6; --line-bold:#3a3f4d;
    --bg:#f4f5f9; --card:#fff; --accent:#4f6ef7; --accent-soft:#e3eafe;
    --peer:#cfdcff; --same:#3f63f2; --error:#e5484d; --error-bg:#fdecec;
    --hint-gold:#ffb020; --hint-bg:#fff3d6; --note:#5b6478;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    padding:10px 12px 12px;
    padding:var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) 12px calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .app{width:100%; max-width:480px; display:flex; flex-direction:column; padding-top:10px}
  .app > * + *{margin-top:10px}

  header{display:flex; align-items:baseline; justify-content:space-between; padding:0 2px}
  h1{font-size:24px; letter-spacing:.14em}
  h1 small{font-size:12px; letter-spacing:.2em; color:var(--muted); margin-left:6px}
  #timer{font-variant-numeric:tabular-nums; color:var(--muted); font-size:15px}

  .bar{display:flex; align-items:center}
  .bar > * + *{margin-left:8px}
  .seg{display:flex; background:#e7e9f0; border-radius:10px; padding:3px; flex:1}
  .seg button{
    flex:1; border:0; background:transparent; padding:8px 0; border-radius:8px;
    font-size:14px; color:var(--muted); cursor:pointer;
  }
  .seg button.on{background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 4px rgba(20,25,50,.12)}
  .btn{
    border:0; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:600; white-space:nowrap;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--card); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}
  .btn.warn{background:#fff7e8; color:#9a6200; box-shadow:inset 0 0 0 1px #f0d9a8}
  .btn:disabled{opacity:.45; pointer-events:none}

  /* ---------- board ---------- */
  .board-wrap{position:relative; width:100%; padding-top:100%} /* 百分比比例盒：替代 aspect-ratio，兼容旧内核 */
  #board{
    position:absolute; top:0; right:0; bottom:0; left:0;
    background:var(--card); border:2.5px solid var(--line-bold); border-radius:6px;
    display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); grid-template-rows:repeat(9,minmax(0,1fr)); overflow:hidden;
    box-shadow:0 6px 24px rgba(25,30,60,.08);
  }
  .cell{
    position:relative; display:flex; align-items:center; justify-content:center;
    min-width:0; min-height:0; overflow:hidden;
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    font-size:22px; font-size:clamp(18px,6vw,28px); font-weight:500; cursor:pointer; background:#fff;
  }
  .cell:nth-child(3n){border-right-width:2.5px; border-right-color:var(--line-bold)}
  .cell:nth-child(9n){border-right:0}
  .cell.br{border-bottom-width:2.5px; border-bottom-color:var(--line-bold)}
  .cell:nth-child(n+73){border-bottom:0}
  .cell.given{font-weight:700; color:var(--ink)}
  .cell.user{color:var(--accent)}
  .cell.peer{background:var(--peer)}
  .cell.same{background:var(--same); color:#fff!important; font-weight:800; box-shadow:inset 0 0 0 2px #2b49b8; z-index:1}
  .cell.sel{background:#ffd166; color:var(--ink)!important; box-shadow:inset 0 0 0 3.5px #f08c00, 0 0 0 1px #f08c00; z-index:2}
  .cell.err{color:var(--error)!important; background:var(--error-bg)}
  .cell.hint-main{background:var(--hint-bg); box-shadow:inset 0 0 0 3px var(--hint-gold); z-index:2}
  .cell.hint-rel{background:#e8f2ff; box-shadow:inset 0 0 0 2px #7db3f5; z-index:1}
  .cell.hint-elim{background:var(--error-bg); box-shadow:inset 0 0 0 2px var(--error); z-index:1}
  .notes{
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(0,1fr));
    width:100%; height:100%; padding:2px;
  }
  .notes span{display:flex; align-items:center; justify-content:center; font-size:10px; font-size:clamp(8px,2.6vw,12px); color:var(--note); line-height:1}
  .notes span.hit{background:var(--same); color:#fff; font-weight:800; border-radius:4px}
  .flash{animation:flash .5s}
  @keyframes flash{0%{background:var(--hint-bg)}100%{}}

  #status{min-height:20px; text-align:center; font-size:13.5px; color:var(--muted); padding:0 4px}
  #status.bad{color:var(--error)}

  /* ---------- keypad ---------- */
  .pad-label{display:flex; align-items:center; font-size:12.5px; color:var(--muted); margin-top:2px}
  .pad-label b{margin-right:8px}
  .pad-label::after{content:""; flex:1; height:1px; background:var(--line)}
  .pad-label b{color:var(--ink); font-size:13px}
  .pad{display:grid; grid-template-columns:repeat(9,1fr); grid-gap:6px; gap:6px}
  .key{
    border:0; border-radius:10px; cursor:pointer; background:var(--card);
    box-shadow:0 1px 3px rgba(20,25,50,.10), inset 0 0 0 1px var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  }
  .key:active{transform:scale(.94); background:var(--accent-soft)}
  .key.done{opacity:.28; pointer-events:none}
  .fill-key{height:58px; color:var(--accent)}
  .fill-key.active{background:var(--same); color:#fff; box-shadow:inset 0 0 0 2px #2b49b8}
  .fill-key.active .left{color:#dbe4ff}
  .fill-key .n{font-size:24px; font-weight:600; line-height:1.05}
  .fill-key .left{font-size:9.5px; color:var(--muted)}
  .note-key{height:46px; color:var(--note); border-style:dashed}
  .note-key .n{font-size:17px; line-height:1}
  .note-key .t{font-size:9px; color:var(--muted)}

  .tools{display:grid; grid-template-columns:1fr 1fr 1fr; grid-gap:8px; gap:8px}
  .tools .btn{padding:12px 0; font-size:15px}

  /* ---------- hint sheet ---------- */
  #mask{
    position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(18,20,32,.45); display:none; z-index:10;
    align-items:flex-end; justify-content:center;
  }
  #mask.show{display:flex}
  .sheet{
    background:var(--card); width:100%; max-width:480px; max-height:78vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:18px 18px 16px; padding:18px 18px calc(16px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
    animation:up .22s ease-out;
  }
  @keyframes up{from{transform:translateY(24px); opacity:.4}to{}}
  .sheet h2{font-size:17px; display:flex; justify-content:space-between; align-items:center}
  .sheet h2 .x{border:0; background:#eef0f5; width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; color:var(--muted)}
  .tech{
    display:inline-block; margin:12px 0 8px; padding:4px 10px; border-radius:20px;
    background:#fff3d6; color:#9a6200; font-size:13px; font-weight:700;
  }
  #hintText{font-size:15px; line-height:1.75; color:#333949; white-space:pre-wrap}
  #hintStep{font-size:12.5px; color:var(--muted); margin-top:4px}
  .sheet .nav{display:flex; margin-top:16px; position:sticky; bottom:0; background:var(--card); padding:10px 0 2px}
  .sheet .nav > * + *{margin-left:8px}
  .sheet .nav .btn{flex:1; padding:12px 0}
  #applyBtn{background:#12a150; display:none}

  #win{
    position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(18,20,32,.5); display:none; z-index:20;
    align-items:center; justify-content:center; padding:20px;
  }
  #win.show{display:flex}
  .win-card{background:#fff; border-radius:18px; padding:30px 26px; text-align:center; max-width:320px; width:100%}
  .win-card .big{font-size:44px}
  .win-card h2{margin:8px 0 6px}
  .win-card p{color:var(--muted); font-size:14px; margin-bottom:18px}
  @media (min-width:520px){ .fill-key{height:64px} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>数独<small>SUDOKU</small></h1>
    <div id="timer">00:00</div>
  </header>

  <div class="bar">
    <div class="seg" id="diffSeg">
      <button data-d="easy" class="on">简单</button>
      <button data-d="medium">中等</button>
      <button data-d="hard">困难</button>
      <button data-d="master">大师</button>
    </div>
    <button class="btn" id="newBtn">新局</button>
  </div>

  <div class="board-wrap"><div id="board"></div></div>
  <div id="status">点选一个格子，再点下方数字填入</div>

  <div>
    <div class="pad-label"><b>填入</b> 正式数字</div>
    <div class="pad" id="fillPad"></div>
  </div>
  <div>
    <div class="pad-label"><b>候选</b> 草稿标记 · 可多选 · 再点一次取消</div>
    <div class="pad" id="notePad"></div>
  </div>

  <div class="tools">
    <button class="btn ghost" id="eraseBtn">⌫ 擦除</button>
    <button class="btn warn" id="hintBtn">💡 逻辑提示</button>
    <button class="btn ghost" id="checkBtn">✓ 检查</button>
  </div>
</div>

<div id="mask">
  <div class="sheet">
    <h2>💡 解题思路 <button class="x" id="hintClose">✕</button></h2>
    <div id="hintStep"></div>
    <div><span class="tech" id="hintTech"></span></div>
    <div id="hintText"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn">← 上一步</button>
      <button class="btn" id="nextBtn">下一步 →</button>
      <button class="btn" id="applyBtn">填入这个数字</button>
    </div>
  </div>
</div>

<div id="win">
  <div class="win-card">
    <div class="big">🎉</div>
    <h2>完成！</h2>
    <p id="winText"></p>
    <button class="btn" id="againBtn" style="width:100%;padding:12px 0">再来一局</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
